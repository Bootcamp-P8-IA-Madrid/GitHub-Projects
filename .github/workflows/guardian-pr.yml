# 🤖 Guardián de PRs — comprueba que cada PR está enlazado con su tarjeta del tablero.
# Se ejecuta solo en cada Pull Request y valida:
#   1. Que la rama se llame feature/<nº>-...                 (falla si no)
#   2. Que la descripción tenga "Closes #<nº>"                (falla si no)
#   3. Que el PR solo toque libros/                           (solo avisa)

name: Guardián de PRs

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

jobs:
  guardian:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar el nombre de la rama
        env:
          RAMA: ${{ github.head_ref }}
        run: |
          echo "🌿 Rama: $RAMA"
          if echo "$RAMA" | grep -qE '^feature/[0-9]+-[a-z0-9-]+$'; then
            echo "✅ El nombre de la rama dice qué se hace y a qué issue responde."
          else
            echo "❌ La rama debe llamarse feature/<nº-issue>-descripcion"
            echo "   Solo minúsculas, números y guiones (sin tildes, ñ ni espacios)."
            echo "   Ejemplo: feature/7-el-hobbit"
            echo "   Una rama no se renombra dentro de un PR: crea otra bien, haz push y abre un PR nuevo."
            exit 1
          fi

      - name: Comprobar que el PR cierra su issue
        env:
          CUERPO: ${{ github.event.pull_request.body }}
          RAMA: ${{ github.head_ref }}
        run: |
          NUM_RAMA=$(echo "$RAMA" | sed -E 's#^[a-z]+/([0-9]+)-.*#\1#')
          if echo "$CUERPO" | grep -qiE "(close[sd]?|fix(e[sd])?|resolve[sd]?) #$NUM_RAMA\b"; then
            echo "✅ El PR cierra la issue #$NUM_RAMA: al hacer merge, la tarjeta pasará sola a Done."
          else
            echo "❌ La descripción del PR debe incluir: Closes #$NUM_RAMA (el mismo número que la rama)"
            echo "   Sin eso, la issue no se cierra y la tarjeta se queda colgada en el tablero."
            exit 1
          fi

      - name: Avisar si el PR toca archivos fuera de su alcance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FUERA=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" \
                    --jq '.[].filename' | grep -v '^libros/' || true)
          if [ -n "$FUERA" ]; then
            echo "⚠️ Este PR toca archivos fuera de libros/ — ¿está eso en la issue?"
            echo "$FUERA"
            echo "::warning::El PR modifica archivos fuera de libros/. Si es otra cosa, va en otra issue."
          else
            echo "✅ El PR solo toca libros/ — alcance correcto."
          fi
